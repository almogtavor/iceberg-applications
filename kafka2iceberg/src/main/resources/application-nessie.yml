spring:
  application:
    name: kafka2iceberg
  main:
    web-application-type: none
  kafka:
    consumer-env:
      topic: input
      table-name: meteor
      bootstrap-servers:
        - localhost:9093
      consumer:
        auto-offset-reset: earliest
  iceberg:
    table-name: iceberg_table
    database-name: kafka2iceberg
    catalog-type: nessie
  s3:
    url: http://localhost
    port: 9000
    access-key: admin
    secret-key: password
    bucket: testbucket
  nessie:
    url: http://localhost:19120/api/v1
    git-ref: main
    auth-type: NONE

